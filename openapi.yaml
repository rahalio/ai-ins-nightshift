openapi: 3.0.3
info:
  title: Nightshift
  version: 0.1.0
  description: >-
    Actuarial production control plane for the valuation and reporting close. Runs
    the dependency-aware job graph unattended, captures lineage for every reported
    figure, blocks sign-off on reconciliation breaks, attributes reserve and
    earnings movement to named causes, drafts reporting narrative for actuarial
    attestation, and gates production status on documentation sufficiency.
  x-product-slug: ai-ins-nightshift
  x-source: ai-in-insurance/deloitte-he_Rise_of_the_Exponential_Actuary/
servers:
  - url: https://api.example.com
tags:
  - name: Runs
    description: Production runs, job graph, unattended execution, and escalation
  - name: Lineage
    description: Model, assumption, extract, and treaty version binding for results
  - name: Reconciliation
    description: Tie-out checkpoints, breaks, and manual adjustments
  - name: Attribution
    description: Movement decomposition into named causes
  - name: Reporting
    description: Narrative drafts, attestation, and disclosure exhibits
  - name: Registry
    description: Model and assumption register, documentation, and change control
  - name: Deliverables
    description: Statutory deadlines, filing consistency, and in-force inventory
paths:
  /v1/production-runs:
    get:
      operationId: listProductionRuns
      tags: [Runs]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: reportingPeriod
          in: query
          schema:
            type: string
            example: 2026-Q2
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: basis
          in: query
          schema:
            $ref: "#/components/schemas/ReportingBasis"
      responses:
        "200":
          description: Production runs page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeProductionRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: scheduleProductionRun
      tags: [Runs]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionRunCreate"
      responses:
        "201":
          description: Run scheduled against the resolved dependency graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProductionRun"
        "409":
          description: >-
            Rejected because a model or assumption set in scope has lapsed
            documentation or an unapproved change request, so it may not enter a
            reported close.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/production-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getProductionRun
      tags: [Runs]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Run with job states, escalations, and sign-off state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProductionRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/production-runs/{runId}/jobs:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: listRunJobs
      tags: [Runs]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, succeeded, failed, retrying, escalated, skipped]
      responses:
        "200":
          description: Jobs in the run graph with dependencies and timings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeRunJob"
  /v1/production-runs/{runId}/jobs/{jobId}/retry:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: retryRunJob
      tags: [Runs]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                forced:
                  type: boolean
                  description: Set when a human overrides the safe-retry assessment
      responses:
        "202":
          description: Retry accepted within the bounded retry policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRunJob"
        "409":
          description: >-
            Retry refused because the job is not safe to retry, for example a
            posting step already committed. Escalated to the named on-call owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/dependency-graph:
    get:
      operationId: getDependencyGraph
      tags: [Runs]
      security:
        - BearerAuth: []
      parameters:
        - name: basis
          in: query
          schema:
            $ref: "#/components/schemas/ReportingBasis"
        - name: undeclaredOnly
          in: query
          schema:
            type: boolean
            description: Return only edges discovered from observed run behaviour
      responses:
        "200":
          description: Job dependency edges including discovered dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDependencyGraph"
  /v1/results/{resultSetId}/lineage:
    parameters:
      - $ref: "#/components/parameters/ResultSetId"
    get:
      operationId: getResultLineage
      tags: [Lineage]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: >-
            Model versions, assumption sets, extracts, and treaty terms that
            produced the figure, reproducible without re-running models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeResultLineage"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/production-runs/{runId}/reconciliations:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: listReconciliationChecks
      tags: [Reconciliation]
      security:
        - BearerAuth: []
      parameters:
        - name: outcome
          in: query
          schema:
            type: string
            enum: [passed, broken, waived]
      responses:
        "200":
          description: Tie-outs between models, ledger, and prior close
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeReconciliationCheck"
  /v1/reconciliation-breaks/{breakId}/adjudication:
    parameters:
      - $ref: "#/components/parameters/BreakId"
    post:
      operationId: adjudicateReconciliationBreak
      tags: [Reconciliation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actuaryId, resolution, rationale]
              properties:
                actuaryId:
                  type: string
                resolution:
                  type: string
                  enum: [corrected_upstream, manual_adjustment, tolerance_accepted, rerun_required]
                rationale:
                  type: string
                manualAdjustmentId:
                  type: string
      responses:
        "200":
          description: Break adjudicated, sign-off unblocked if resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReconciliationBreak"
  /v1/manual-adjustments:
    post:
      operationId: recordManualAdjustment
      tags: [Reconciliation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualAdjustmentCreate"
      responses:
        "201":
          description: Adjustment recorded permanently with reason and approver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeManualAdjustment"
        "422":
          description: Rejected when no reason, owner, or approver is supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/production-runs/{runId}/attribution:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getMovementAttribution
      tags: [Attribution]
      security:
        - BearerAuth: []
      parameters:
        - name: measure
          in: query
          schema:
            type: string
            enum: [technical_provision, contractual_service_margin, earnings, liability_for_future_policy_benefits]
        - name: groupingLevel
          in: query
          schema:
            type: string
            enum: [entity, portfolio, contract_group, cohort, product]
      responses:
        "200":
          description: Movement decomposed into named causes at required disaggregation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMovementAttribution"
  /v1/attribution-items/{attributionItemId}/reclassification:
    parameters:
      - $ref: "#/components/parameters/AttributionItemId"
    post:
      operationId: reclassifyAttributionCause
      tags: [Attribution]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actuaryId, revisedCause, rationale]
              properties:
                actuaryId:
                  type: string
                revisedCause:
                  $ref: "#/components/schemas/AttributionCause"
                rationale:
                  type: string
      responses:
        "200":
          description: Cause reclassified by an actuary with recorded rationale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAttributionItem"
  /v1/narratives:
    get:
      operationId: listNarrativeDrafts
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: runId
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [generated, in_edit, awaiting_attestation, attested, published, withdrawn]
      responses:
        "200":
          description: Narrative and memorandum drafts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeNarrativeDraft"
    post:
      operationId: generateNarrativeDraft
      tags: [Reporting]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NarrativeDraftCreate"
      responses:
        "201":
          description: Draft generated from attributed movements, unsigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeNarrativeDraft"
  /v1/narratives/{narrativeId}/attestation:
    parameters:
      - $ref: "#/components/parameters/NarrativeId"
    post:
      operationId: attestNarrative
      tags: [Reporting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationCreate"
      responses:
        "200":
          description: Narrative attested by a named credentialed actuary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAttestation"
        "403":
          description: >-
            Refused because the signer is not a credentialed actuary. Generated
            output may never be issued as an actuarial opinion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/production-runs/{runId}/sign-off:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: signOffProductionRun
      tags: [Reporting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationCreate"
      responses:
        "200":
          description: Close signed off and results released for posting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProductionRun"
        "409":
          description: >-
            Sign-off blocked by an unresolved reconciliation break or an
            unattested required narrative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/registry/models:
    get:
      operationId: listModelRegistryEntries
      tags: [Registry]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: productionStatus
          in: query
          schema:
            type: string
            enum: [in_production, quarantined, retired]
        - name: documentationState
          in: query
          schema:
            type: string
            enum: [sufficient, insufficient, lapsed]
      responses:
        "200":
          description: Model register with ownership and documentation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeModelRegistryEntry"
    post:
      operationId: registerActuarialModel
      tags: [Registry]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRegistryEntryCreate"
      responses:
        "201":
          description: Model registered, production status pending documentation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeModelRegistryEntry"
  /v1/registry/assumption-sets:
    get:
      operationId: listAssumptionSets
      tags: [Registry]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: assumptionType
          in: query
          schema:
            type: string
            enum: [mortality, morbidity, lapse, expense, discount_rate, reinsurance, economic]
      responses:
        "200":
          description: Versioned assumption sets with supporting studies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAssumptionSet"
  /v1/registry/change-requests:
    get:
      operationId: listChangeRequests
      tags: [Registry]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [draft, impact_pending, awaiting_approval, approved, rejected, implemented]
      responses:
        "200":
          description: Model and assumption change requests page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeChangeRequest"
    post:
      operationId: raiseChangeRequest
      tags: [Registry]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRequestCreate"
      responses:
        "201":
          description: Change raised, impact assessment required before approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeChangeRequest"
  /v1/registry/change-requests/{changeRequestId}/impact-assessment:
    parameters:
      - $ref: "#/components/parameters/ChangeRequestId"
    post:
      operationId: submitImpactAssessment
      tags: [Registry]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactAssessmentCreate"
      responses:
        "201":
          description: Quantified impact recorded so the change is separable in attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeImpactAssessment"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/deliverables:
    get:
      operationId: listRegulatoryDeliverables
      tags: [Deliverables]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [not_started, in_progress, at_risk, submitted, late]
      responses:
        "200":
          description: Statutory deliverables against deadlines with early warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeRegulatoryDeliverable"
  /v1/deliverables/filing-consistency:
    get:
      operationId: getFilingConsistencyCheck
      tags: [Deliverables]
      security:
        - BearerAuth: []
      parameters:
        - name: filingReference
          in: query
          required: true
          schema:
            type: string
        - name: cohort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Pricing basis reconciled to valuation basis for the cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFilingConsistencyCheck"
  /v1/deliverables/inforce-inventory:
    post:
      operationId: queryInforceInventory
      tags: [Deliverables]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InforceInventoryQueryCreate"
      responses:
        "200":
          description: >-
            Exposure and concentration answer, for example count and reserve for
            lives above attained age 90 or contracts carrying a given guarantee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeInforceInventoryResult"
  /v1/cycle-composition:
    get:
      operationId: getCycleComposition
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - name: reportingPeriod
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Production versus analysis hours and drafting hours per close
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCycleComposition"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    ResultSetId:
      name: resultSetId
      in: path
      required: true
      schema:
        type: string
    BreakId:
      name: breakId
      in: path
      required: true
      schema:
        type: string
    AttributionItemId:
      name: attributionItemId
      in: path
      required: true
      schema:
        type: string
    NarrativeId:
      name: narrativeId
      in: path
      required: true
      schema:
        type: string
    ChangeRequestId:
      name: changeRequestId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: USD
    ReportingBasis:
      type: string
      enum:
        - ifrs17
        - long_duration_targeted_improvements
        - statutory
        - principle_based_reserving
        - solvency
        - management
    RunStatus:
      type: string
      enum:
        - scheduled
        - running
        - completed_unattended
        - completed_with_intervention
        - failed
        - awaiting_adjudication
        - signed_off
    AttributionCause:
      type: string
      enum:
        - new_business
        - expected_release
        - assumption_change
        - experience_variance
        - model_change
        - data_correction
        - reinsurance
        - economic_movement
        - manual_adjustment
        - unexplained
    ProductionRun:
      type: object
      required: [id, reportingPeriod, basis, status]
      properties:
        id:
          type: string
        reportingPeriod:
          type: string
        basis:
          $ref: "#/components/schemas/ReportingBasis"
        status:
          $ref: "#/components/schemas/RunStatus"
        scheduledStart:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        jobCount:
          type: integer
        unattendedCompletionRate:
          type: number
          format: float
        escalationCount:
          type: integer
        openBreakCount:
          type: integer
        onCallOwnerId:
          type: string
        signedOffBy:
          type: string
        signedOffAt:
          type: string
          format: date-time
    ProductionRunCreate:
      type: object
      required: [reportingPeriod, basis]
      properties:
        reportingPeriod:
          type: string
        basis:
          $ref: "#/components/schemas/ReportingBasis"
        scheduledStart:
          type: string
          format: date-time
        modelScope:
          type: array
          items:
            type: string
        onCallOwnerId:
          type: string
    RunJob:
      type: object
      required: [id, runId, jobKind, status]
      properties:
        id:
          type: string
        runId:
          type: string
        jobKind:
          type: string
          enum:
            - data_extract
            - model_execution
            - aggregation
            - allocation
            - reconciliation_check
            - attribution
            - posting
        name:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed, retrying, escalated, skipped]
        dependsOn:
          type: array
          items:
            type: string
        safeToRetry:
          type: boolean
        attempt:
          type: integer
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        failureReason:
          type: string
        escalatedToUserId:
          type: string
    DependencyEdge:
      type: object
      required: [fromJob, toJob, origin]
      properties:
        fromJob:
          type: string
        toJob:
          type: string
        origin:
          type: string
          enum: [declared, discovered]
        firstObservedAt:
          type: string
          format: date-time
        causedFailures:
          type: integer
    DependencyGraph:
      type: object
      properties:
        basis:
          $ref: "#/components/schemas/ReportingBasis"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdge"
        undeclaredEdgeCount:
          type: integer
    ResultSet:
      type: object
      required: [id, runId, measure]
      properties:
        id:
          type: string
        runId:
          type: string
        measure:
          type: string
        groupingLevel:
          type: string
          enum: [entity, portfolio, contract_group, cohort, product]
        groupingKey:
          type: string
        value:
          $ref: "#/components/schemas/Money"
        priorValue:
          $ref: "#/components/schemas/Money"
    ResultLineage:
      type: object
      properties:
        resultSetId:
          type: string
        modelVersions:
          type: array
          items:
            type: object
            properties:
              modelId:
                type: string
              version:
                type: string
              codeHash:
                type: string
        assumptionSetIds:
          type: array
          items:
            type: string
        dataExtracts:
          type: array
          items:
            type: object
            properties:
              extractId:
                type: string
              sourceSystem:
                type: string
              asOfDate:
                type: string
                format: date
              recordCount:
                type: integer
        treatyTermsIds:
          type: array
          items:
            type: string
        manualAdjustmentIds:
          type: array
          items:
            type: string
        reproducibleWithoutRerun:
          type: boolean
    ReconciliationCheck:
      type: object
      required: [id, runId, checkKind, outcome]
      properties:
        id:
          type: string
        runId:
          type: string
        checkKind:
          type: string
          enum:
            - model_to_ledger
            - model_to_extract
            - period_over_period
